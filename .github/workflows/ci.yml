name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes automatizados (Vitest)
        run: npm test

      - name: Build de produção (inclui verificação de tipos)
        run: npm run build

      - name: Publicar build como artefato
        uses: actions/upload-artifact@v7
        with:
          name: eletrilab-3d-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
